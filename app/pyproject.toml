
[project]
name = "wlrs-demo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic>=2.8.0,<3.0.0",
    "httpx==0.27.0",
    "tenacity==8.4.2",
    "openai>=1.104.2",
    "pypdf==4.3.1",
    "trafilatura==1.6.3",
    "redis==6.2.0",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.1",
    "jsonschema==4.22.0",
    "orjson==3.10.3",
    # --- Existing dependencies preserved below ---
    "langchain>=0.3.27",
    "langchain-openai>=0.3.28",
    "pydantic-settings>=2.1.0",
    "psutil>=5.9.0",
    "langgraph>=0.2.30",
    "azure-core>=1.30.0",
    "tavily-python>=0.4.0",
    "langchain-community>=0.3.27",
    "azure-storage-blob>=12.26.0",
    "azure-search-documents>=11.5.3",
    "azure-identity>=1.24.0",
    "beautifulsoup4>=4.13.4",
    "azure-ai-documentintelligence>=1.0.2",
    "langgraph>=0.6.4",
    "structlog>=25.4.0",
    "grandalf",
    "langgraph-checkpoint-redis",
    "uuid"
]

# (optional) dev helpers
[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "ruff==0.5.5",
    "httpx[http2]==0.27.0"
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# tell setuptools that code lives under ./src
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
packages = ["app"]

line-length = 88
target-version = ['py311']

profile = "black"
line_length = 88
