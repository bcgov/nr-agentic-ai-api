[project]
name = "agentic-backend"
version = "0.1.0"
description = "FastAPI backend for the agentic water permit assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "redis",
    "httpx",
    "azure-identity",
    "azure-search-documents",
    "azure-cosmos",
    "tenacity",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
    "backend/tests",
]
pythonpath = [
    "backend",
]
